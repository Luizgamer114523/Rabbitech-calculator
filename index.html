<style>
:root{--bg:#06110d;--p:#0c1d17;--p2:#12281f;--ln:#24473a;--tx:#eafff5;--mu:#98b9aa;--g:#5dffb0;--c:#4fd8ff;--v:#b58bff;--r:#ff8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body,button,input,select{ -webkit-tap-highlight-color:transparent }button{touch-action:manipulation;-webkit-appearance:none;appearance:none}input,select{font-size:16px;-webkit-appearance:none;appearance:none;border-radius:12px}img{max-width:100%;height:auto}button:focus{outline-offset:2px}@media(max-width:520px){main{padding:10px}.card{padding:12px;border-radius:15px}.live b{font-size:46px}.g2{gap:8px}nav button{font-size:12px;padding:0 4px;min-height:46px}.row{gap:7px}.st button{min-width:44px;width:44px}.pts{min-width:48px}}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 20% 0,#14382b,transparent 55%),radial-gradient(ellipse at 90% 30%,#2a1b4d55,transparent 50%),var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#06110df0;border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo b{letter-spacing:.2em;color:var(--g);font-size:15px;text-shadow:0 0 12px #5dffb066}.logo small{display:block;color:var(--c);letter-spacing:.3em;font-size:10px}
.tm{text-align:right;font-size:13px;color:var(--mu)}.tm b{color:var(--tx);font-size:15px}
main{max-width:760px;margin:auto;padding:14px}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px}h3{margin:0;font-size:16px;color:var(--g)}.mu{color:var(--mu);font-size:13px}
button,select,input{font:inherit;color:var(--tx)}
button{min-height:48px;padding:0 16px;border-radius:13px;border:1px solid var(--ln);background:var(--p2);font-weight:700;cursor:pointer}
button.pri{background:var(--g);color:#032014;border-color:var(--g)}button.dng{color:#ffc4c4;border-color:#6b3030}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c);outline-offset:2px}
input,select{width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--ln);background:#05100c}
label{display:block;margin:8px 0 4px;color:var(--mu);font-size:13px}
.live{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;text-align:center;border:1px solid var(--g);box-shadow:0 0 24px #5dffb033}
.live span{font-size:12px;letter-spacing:.2em;color:var(--mu)}.live b{display:block;font-size:52px;line-height:1;color:var(--g);text-shadow:0 0 18px #5dffb088}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #1b3a2f}
.row .l{flex:1}.row .l small{display:block;color:var(--mu)}.pts{min-width:64px;text-align:right;color:var(--c);font-weight:800}
.st{display:flex;align-items:center;gap:6px}.st button{width:48px;padding:0;font-size:22px}.st output{min-width:32px;text-align:center;font-weight:800;font-size:18px}
.tg{width:104px}.tg[aria-pressed=true]{background:var(--v);color:#150833;border-color:var(--v)}.tg:disabled{opacity:.4}
.warn{color:#ffd37a;font-size:13px;margin-top:4px}.sub{display:flex;justify-content:space-between;margin-top:6px;font-weight:800;color:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#06110df5;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{border:0;background:none;border-radius:10px;color:var(--mu);font-size:13px}nav button[aria-current=page]{color:var(--g);background:var(--p2);box-shadow:inset 0 -3px var(--g)}
.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--g),var(--c));margin:3px 0 8px}
.bar.b{background:linear-gradient(90deg,var(--v),var(--c))}
details{border-top:1px solid #1b3a2f;padding:8px 0}summary{cursor:pointer;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hide{display:none}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--g);color:#032014;padding:10px 18px;border-radius:20px;font-weight:800;z-index:9}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid #1b3a2f}.sc{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.live b{transition:transform .12s}}
#timer-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;width:100%;height:100vh;height:100dvh;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 20% 0,#14382b,transparent 55%),radial-gradient(ellipse at 90% 30%,#2a1b4d,transparent 55%),var(--bg);text-align:center;overflow:auto}
#timer-overlay.done{display:none}.timer-card{width:min(100%,900px);margin:auto;padding:clamp(20px,5vw,48px);border:1px solid var(--c);border-radius:clamp(18px,4vw,32px);background:linear-gradient(180deg,#102a30,#0c1d17);box-shadow:0 0 45px #4fd8ff20}
.timer-label{font-size:clamp(13px,2vw,20px);letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.timer-display{font-variant-numeric:tabular-nums;font-size:clamp(100px,27vw,240px);line-height:1.02;font-weight:900;color:var(--c);margin:clamp(20px,5vh,48px) 0;text-shadow:0 0 30px #4fd8ff30}
.timer-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.timer-actions button{min-width:min(220px,100%);min-height:60px;font-size:clamp(16px,3vw,22px)}.timer-actions button:disabled{opacity:.45;cursor:not-allowed}
.timer-note{font-size:clamp(14px,2vw,18px);color:var(--mu);margin-top:18px}.timer-instructions{color:var(--mu);font-size:14px;margin-top:22px}
body.timer-locked{overflow:hidden}
</style></head><body>
<header><div class="logo"><b>RABBITECH</b><small>BIOGLOW SCORE</small></div><div class="tm" id="tm"></div></header>
<section id="timer-overlay" aria-label="Cronômetro da partida">
 <div class="timer-card">
  <div class="timer-label">Rabbitech · Tempo da partida</div>
  <div class="timer-display" id="timer-display" role="timer" aria-live="off">2:30</div>
  <div class="timer-actions"><button class="pri" id="timer-start" type="button">▶ Iniciar partida</button><button id="timer-pause" type="button" disabled>⏸ Pausar</button><button id="timer-reset" class="dng" type="button">↺ Reiniciar</button></div>
  <div class="timer-note" id="timer-note" aria-live="polite">A pontuação será liberada quando o tempo terminar.</div>
  <div class="timer-instructions">2 minutos e 30 segundos · Deixe esta tela aberta durante a partida.</div>
 </div>
</section>
<main id="app"></main><nav id="nav" class="hide"></nav><div id="toast"></div>
<script>
const KEY='rabbitech.bioglow.v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- Scoring model (values from the official Game Missions + Rulebook PDFs) ----
const MS=[
{id:'m1',n:'Missão 01 — Mighty Microbiomes',f:[
 {k:'yf',l:'Espécies-chave na Young Forest',t:'n',max:3,p:20,h:'Máx. 3 pontuam. Devem estar soltas (sem tocar em equipamentos).'},
 {k:'gt',l:'Espécies-chave na Grand Tree',t:'n',max:3,p:20},
 {k:'ht',l:'Espécies-chave na Holpior Tree',t:'n',max:3,p:20},
 {k:'queen',l:'Rainha invasora derrubada (lado oposto)',t:'b',p:0,h:'Acionada pela 4ª espécie na Young Forest. Exige 3 na Young Forest.',en:i=>i.yf===3},
 {k:'_bonus',l:'Bônus: 3+ na Young Forest E rainha derrubada',t:'d',p:40,d:i=>i.yf>=3&&i.queen?1:0}]},
{id:'m2',n:'Missão 02 — Roots of Renewal',f:[
 {k:'base',l:'Recursos na Grand Tree Base',t:'n',max:99,p:5,h:'Sem máximo oficial informado (99 é um limite do app).'},
 {k:'canopy',l:'Recursos na Canopy Chamber',t:'n',max:15,p:10,h:'Máx. 15. Devem subir pela árvore, nunca colocados direto.'}]},
{id:'m3',n:'Missão 03 — Cave Waterfall',f:[
 {k:'cave',l:'Espécies-chave na cachoeira (leitura do contador)',t:'n',max:50,p:5,h:'Máx. 50. O contador só avança com espécies passando pela cachoeira.'}]},
{id:'m4',n:'Missão 04 — Rainforest Awakening',f:[
 {k:'nest',l:'TODAS as espécies-chave liberadas do ninho',t:'b',p:30},
 {k:'hollow',l:'TODOS os recursos liberados da Holpior Tree',t:'b',p:20}]},
{id:'m5',n:'Missão 05 — Central Haven (cooperativa)',shared:1,f:[
 {k:'haven',l:'Peças completamente na Central Haven',t:'n',max:99,p:5,h:'Compartilhada: AMBAS as equipes recebem a pontuação total. Conte todas as peças, quem quer que as tenha entregue.'}]},
{id:'m6',n:'Level Up — Invasive Attack (opcional)',f:[
 {k:'added',l:'Espécies invasoras adicionadas na preparação',t:'n',max:5,p:20},
 {k:'contain',l:'Espécies invasoras na zona de contenção',t:'n',max:5,p:10},
 {k:'qdel',l:'Rainha invasora na zona de contenção',t:'b',p:10}]}];
const PEN=[0,10,30];
const cl=(v,a,b)=>Math.max(a,Math.min(b,Math.floor(+v||0)));
const blank=()=>({yf:0,gt:0,ht:0,queen:0,base:0,canopy:0,cave:0,nest:0,hollow:0,haven:0,added:0,contain:0,qdel:0,pen:0});
function calc(i){let sum=0;const parts=MS.map(m=>{let t=0;const lines=m.f.map(f=>{let v=f.t==='d'?f.d(i):f.t==='b'?(i[f.k]&&(!f.en||f.en(i))?1:0):cl(i[f.k],0,f.max);const pts=v*f.p;t+=pts;return{l:f.l,qty:v,each:f.p,pts}});sum+=t;return{id:m.id,name:m.n,pts:t,lines}});
 const pen=cl(i.pen,0,3);let pp=pen?-PEN[Math.min(pen,2)]:0;let total=Math.max(0,sum+pp);if(pen===3){total=0;pp=-sum}
 return{parts,penalty:pp,pen,total}}
// ---- Storage (browser localStorage; a single JSON document, easy to migrate to a backend) ----
let STORAGE_OK=true,DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){STORAGE_OK=false}
DB=DB&&Array.isArray(DB.teams)&&Array.isArray(DB.matches)?DB:{version:1,teams:[],matches:[],currentTeamId:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));STORAGE_OK=true}catch(e){STORAGE_OK=false;toast('Safari bloqueou o salvamento. Exporte um backup em Equipes.')}};
const team=id=>DB.teams.find(t=>t.id===id),cur=()=>team(DB.currentTeamId);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let view='match',I=blank(),info={label:'',opp:'',type:'Treino'};
// Cronômetro em tela inteira: a pontuação só é liberada ao terminar os 150 segundos.
const TIMER_TOTAL=150000;
let timerRemaining=TIMER_TOTAL,timerStartedAt=0,timerInterval=null,timerRunning=false,timerHasStarted=false;
const timerOverlay=$('#timer-overlay'),timerDisplay=$('#timer-display'),timerStart=$('#timer-start'),timerPause=$('#timer-pause'),timerReset=$('#timer-reset'),timerNote=$('#timer-note');
document.body.classList.add('timer-locked');
function drawTimer(){
 const ms=Math.max(0,timerRemaining),secs=Math.ceil(ms/1000),mm=Math.floor(secs/60),ss=secs%60;
 timerDisplay.textContent=mm+':'+String(ss).padStart(2,'0');
 timerDisplay.style.color=ms===0?'var(--r)':'var(--c)';
}
function stopTimerInterval(){if(timerInterval!==null){clearInterval(timerInterval);timerInterval=null}}
function finishTimer(){
 timerRemaining=0;timerRunning=false;stopTimerInterval();drawTimer();
 timerNote.textContent='Tempo encerrado! Liberando pontuação…';timerStart.disabled=true;timerPause.disabled=true;timerReset.disabled=true;
 setTimeout(()=>{timerOverlay.classList.add('done');document.body.classList.remove('timer-locked')},900);
}
function tickTimer(){
 timerRemaining=Math.max(0,timerRemaining-(performance.now()-timerStartedAt));
 if(timerRemaining<=0){finishTimer();return}
 timerStartedAt=performance.now();drawTimer();
}
timerStart.addEventListener('click',()=>{
 if(timerRunning||timerRemaining<=0)return;
 timerRunning=true;timerHasStarted=true;timerStartedAt=performance.now();
 timerStart.disabled=true;timerPause.disabled=false;timerPause.textContent='⏸ Pausar';
 timerStart.textContent='⏱ Partida em andamento';timerNote.textContent='Aguarde o fim dos 2:30 para registrar os pontos.';
 timerInterval=setInterval(tickTimer,100);
});
timerPause.addEventListener('click',()=>{
 if(timerRemaining<=0)return;
 if(timerRunning){
  timerRemaining=Math.max(0,timerRemaining-(performance.now()-timerStartedAt));
  timerRunning=false;stopTimerInterval();drawTimer();timerStart.disabled=false;
  timerStart.textContent='▶ Continuar partida';timerPause.textContent='▶ Continuar';
  timerNote.textContent='Cronômetro pausado. A pontuação continua bloqueada.';
 }else if(timerHasStarted){
  timerRunning=true;timerStartedAt=performance.now();timerStart.disabled=true;
  timerPause.textContent='⏸ Pausar';timerNote.textContent='Partida em andamento. A pontuação será liberada ao terminar.';
  timerInterval=setInterval(tickTimer,100);
 }
});
timerReset.addEventListener('click',()=>{
 stopTimerInterval();timerRemaining=TIMER_TOTAL;timerRunning=false;timerHasStarted=false;
 timerStart.disabled=false;timerStart.textContent='▶ Iniciar partida';timerPause.disabled=true;timerPause.textContent='⏸ Pausar';
 timerNote.textContent='Cronômetro reiniciado. A pontuação será liberada quando o tempo terminar.';drawTimer();
});
drawTimer();
function toast(t){const e=$('#toast');e.className='toast';e.textContent=t;setTimeout(()=>e.className='',1800)}

function render(){const t=cur();$('#tm').innerHTML=t?`Equipe: <b>${esc(t.name)}</b>${t.number?' #'+esc(t.number):''}`:'';
 $('#nav').className=t?'':'hide';
 if(!t)return welcome();
 $('#nav').innerHTML=[['match','Pontuação'],['teams','Equipes'],['cmp','Comparar'],['hist','Histórico']].map(([k,l])=>`<button data-v="${k}" ${view===k?'aria-current="page"':''}>${l}</button>`).join('');
 ({match:vMatch,teams:vTeams,cmp:vCmp,hist:vHist})[view]()}
function welcome(){$('#app').innerHTML=`<div class="card"><h2>Bem-vindos ao Rabbitech BIOGLOW Score</h2><p class="mu">Informe os dados da equipe para começar.</p>
<label for="wn">Nome da equipe</label><input id="wn" autocomplete="off"><label for="wo">Número da equipe (opcional)</label><input id="wo" inputmode="numeric"><p></p><button class="pri" id="wgo" style="width:100%">Começar</button>
<p class="mu">Ferramenta independente de pontuação — não é um site oficial da FIRST nem da LEGO. As pontuações ficam salvas neste navegador e dispositivo. No iPad, abra no Safari e use “Adicionar à Tela de Início” para facilitar o acesso.</p></div>`;
 $('#wgo').onclick=()=>{if(addTeam($('#wn').value,$('#wo').value))render();else $('#wn').focus()}}
function field(f){const v=f.t==='d'?f.d(I):I[f.k],dis=f.en&&!f.en(I);let c;
 if(f.t==='n')c=`<div class="st"><button data-s="${f.k}" data-d="-1" aria-label="Diminuir ${esc(f.l)}">−</button><output>${cl(v,0,f.max)}</output><button data-s="${f.k}" data-d="1" aria-label="Aumentar ${esc(f.l)}">+</button></div>`;
 else if(f.t==='b')c=`<button class="tg" data-t="${f.k}" aria-pressed="${!!v&&!dis}" ${dis?'disabled':''}>${v&&!dis?'✓ Sim':'Não'}</button>`;
 else c=`<span class="tg" style="text-align:center">${v?'✓ Obtido':'Bloqueado'}</span>`;
 const pts=(f.t==='d'?v:f.t==='b'?(v&&!dis?1:0):cl(v,0,f.max))*f.p;
 return `<div class="row"><div class="l">${esc(f.l)}${f.h?`<small>${esc(f.h)}</small>`:''}${dis&&f.t==='b'?'<small class="warn">Indisponível até haver 3 espécies na Young Forest</small>':''}</div>${c}<div class="pts">${pts?'+'+pts:'0'}</div></div>`}
function vMatch(){if(!I.queen&&0){}if(I.yf!==3)I.queen=0;const r=calc(I),n=DB.matches.filter(m=>m.teamId===DB.currentTeamId).length+1;
 const w=I.contain>I.added?'<div class="warn">⚠ Há mais espécies invasoras na contenção do que as adicionadas na preparação — confira a contagem.</div>':'';
 $('#app').innerHTML=`<div class="card live"><span>PONTUAÇÃO ATUAL</span><b id="tot">${r.total}</b></div>
<div class="card g2"><div><label for="ml">Nome da partida</label><input id="ml" placeholder="Partida ${n}" value="${esc(info.label)}"></div><div><label for="mt">Tipo</label><select id="mt"><option${info.type==='Treino'?' selected':''}>Treino</option><option${info.type==='Oficial'?' selected':''}>Oficial</option></select></div>
<div style="grid-column:1/-1"><label for="mo">Outra equipe na mesa (opcional)</label><input id="mo" value="${esc(info.opp)}"></div></div>`+
 MS.map((m,x)=>`<div class="card"><h3>${m.n}</h3><img src="${IMG[m.id]}" alt="Foto do modelo: ${esc(m.n)}" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin:8px 0;background:#fff">${m.f.map(field).join('')}<div class="sub"><span>Total da missão</span><span>${r.parts[x].pts} pts</span></div>${m.id==='m6'?w:''}</div>`).join('')+
 `<div class="card"><h3>Penalidades por interferência</h3><div class="row"><div class="l">Penalidades marcadas pelo juiz<small>1ª: −10 · 2ª: mais −20 · 3ª: pontuação da partida é zero</small></div><div class="st"><button data-s="pen" data-d="-1" aria-label="Menos penalidades">−</button><output>${I.pen}</output><button data-s="pen" data-d="1" aria-label="Mais penalidades">+</button></div><div class="pts">${r.penalty}</div></div></div>
<div class="card"><h3>Detalhamento</h3>${bd(r)}<button class="pri" id="sv" style="width:100%;margin-top:12px">Salvar partida</button><button id="rs" style="width:100%;margin-top:8px">Limpar formulário</button></div>`;
 $('#ml').oninput=e=>info.label=e.target.value;$('#mo').oninput=e=>info.opp=e.target.value;$('#mt').onchange=e=>info.type=e.target.value;
 $('#sv').onclick=()=>{const t=cur(),r=calc(I);DB.matches.push({id:uid(),teamId:t.id,teamName:t.name,teamNumber:t.number,match:info.label.trim()||'Partida '+n,type:info.type,opponent:info.opp.trim(),date:new Date().toISOString(),total:r.total,penalty:r.penalty,breakdown:r.parts,inputs:{...I}});save();I=blank();info.label='';info.opp='';toast('Partida salva');view='hist';render()};
 $('#rs').onclick=()=>{if(confirm('Limpar todos os campos?')){I=blank();render()}}}
function bd(r){return r.parts.map(p=>`<details><summary><span>${p.name}</span><b>${p.pts}</b></summary>${p.lines.filter(l=>l.qty).map(l=>`<div class="mu">${esc(l.l)}: ${l.qty} × ${l.each} = ${l.pts}</div>`).join('')||'<div class="mu">Sem pontos</div>'}</details>`).join('')+`<div class="row"><span>Penalidades</span><b>${r.penalty}</b></div><div class="row"><b>TOTAL</b><b style="color:var(--g)">${r.total}</b></div>`}
const mine=id=>DB.matches.filter(m=>m.teamId===id),avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length*10)/10:0;
function vTeams(){const t0=cur();$('#app').innerHTML=`<div class="card"><h2>Equipes</h2>${DB.teams.map(t=>{const a=mine(t.id).map(m=>m.total);return `<div class="row"><div class="l"><b>${esc(t.name)}</b>${t.number?' #'+esc(t.number):''}<small>${a.length} partidas${a.length?` · melhor ${Math.max(...a)} · média ${avg(a)} · pior ${Math.min(...a)}`:''}</small></div>${t.id===t0.id?'<span class="pts">Ativa</span>':`<button data-sel="${t.id}">Selecionar</button>`}<button class="dng" data-del="${t.id}" aria-label="Excluir ${esc(t.name)}">🗑</button></div>`}).join('')}</div>
<div class="card"><h2>Adicionar equipe</h2><label for="nn">Nome da equipe</label><input id="nn"><label for="no">Número (opcional)</label><input id="no" inputmode="numeric"><p></p><button class="pri" id="na" style="width:100%">Adicionar e selecionar</button></div>
<div class="card"><h2>Seus dados</h2><p class="mu">📍 Dados salvos apenas neste navegador, não na nuvem. No iPad, use Exportar e escolha “Salvar em Arquivos” para fazer backup ou transferir para outro dispositivo.</p><div class="g2"><button id="ex">Exportar pontuações</button><button id="im">Importar pontuações</button></div><input type="file" id="fi" accept="application/json,.json" class="hide"></div>`;
 $('#na').onclick=()=>{if(addTeam($('#nn').value,$('#no').value)){I=blank();render()}};
 $('#ex').onclick=async()=>{const name='rabbitech-bioglow-scores-'+new Date().toISOString().slice(0,10)+'.json';const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Rabbitech BIOGLOW Score'});return}}catch(e){if(e.name==='AbortError')return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(e){}},60000);toast('Se o arquivo não baixar, abra o link e use Compartilhar > Salvar em Arquivos')};
 $('#im').onclick=()=>$('#fi').click();
 $('#fi').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.teams)||!Array.isArray(d.matches))throw 0;if(!confirm('Mesclar '+d.teams.length+' equipes e '+d.matches.length+' partidas neste dispositivo? Os registros existentes são mantidos.'))return;d.teams.forEach(t=>{if(!team(t.id))DB.teams.push(t)});d.matches.forEach(m=>{if(!DB.matches.some(x=>x.id===m.id)&&team(m.teamId))DB.matches.push(m)});save();toast('Importado');render()}catch(x){alert('Arquivo de pontuações inválido.')}}}
function vCmp(){const T=DB.teams.filter(t=>mine(t.id).length);if(!T.length){$('#app').innerHTML='<div class="card"><h2>Comparar</h2><p class="mu">Salve partidas de pelo menos uma equipe para ver as comparações.</p></div>';return}
 const st=T.map(t=>{const a=mine(t.id);return{t,n:a.length,best:Math.max(...a.map(m=>m.total)),avg:avg(a.map(m=>m.total)),ms:MS.map((_,x)=>avg(a.map(m=>m.breakdown[x]?.pts||0)))}}),mx=Math.max(...st.map(s=>s.best),1);
 $('#app').innerHTML=`<div class="card"><h2>Média x melhor pontuação</h2>${st.map(s=>`<div><b>${esc(s.t.name)}</b> <span class="mu">${s.n} partidas</span><div class="bar" style="width:${s.avg/mx*100}%"></div><div class="bar b" style="width:${s.best/mx*100}%"></div><div class="mu">média ${s.avg} · melhor ${s.best}</div></div>`).join('')}<p class="mu">Verde = média, roxo = melhor. O ranking do jogo nos eventos usa a média de todas as partidas.</p></div>
<div class="card sc"><h2>Média por missão</h2><table><tr><th>Missão</th>${st.map(s=>`<th>${esc(s.t.name)}</th>`).join('')}</tr>${MS.map((m,x)=>`<tr><td>${m.n.split(' — ')[0].replace('Level Up','Level Up')}</td>${st.map(s=>`<td>${s.ms[x]}</td>`).join('')}</tr>`).join('')}</table></div>`}
function vHist(){const t=cur(),a=mine(t.id).slice().reverse(),s=a.map(m=>m.total);
 $('#app').innerHTML=`<div class="card"><h2>Histórico — ${esc(t.name)}</h2>${a.length?`<div class="g2"><div class="mu">Partidas<br><b>${a.length}</b></div><div class="mu">Média<br><b>${avg(s)}</b></div><div class="mu">Maior<br><b>${Math.max(...s)}</b></div><div class="mu">Menor<br><b>${Math.min(...s)}</b></div></div>`:'<p class="mu">Nenhuma partida salva ainda.</p>'}</div>`+
 a.map(m=>`<div class="card"><details><summary><span><b>${esc(m.match)}</b> <span class="mu">${m.type||''}<br>${new Date(m.date).toLocaleString('pt-BR')}${m.opponent?' · com '+esc(m.opponent):''}</span></span><b style="font-size:24px;color:var(--g)">${m.total}</b></summary>${bd({parts:m.breakdown,penalty:m.penalty,total:m.total})}<p class="mu">A Central Haven é compartilhada: a outra equipe recebeu os mesmos pontos da Central Haven.</p><button class="dng" data-dm="${m.id}">Excluir partida</button></details></div>`).join('')}
// ---- Events ----
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.v){view=d.v;render();scrollTo(0,0)}
 else if(d.s){const f=MS.flatMap(m=>m.f).find(f=>f.k===d.s),mx=d.s==='pen'?3:f.max;I[d.s]=cl(I[d.s]+ +d.d,0,mx);render()}
 else if(d.t){I[d.t]=I[d.t]?0:1;render()}
 else if(d.sel){DB.currentTeamId=d.sel;save();I=blank();render()}
 else if(d.del){const t=team(d.del);if(confirm('Excluir a equipe "'+t.name+'" e TODAS as suas partidas salvas? Isso não pode ser desfeito.')){DB.teams=DB.teams.filter(x=>x.id!==t.id);DB.matches=DB.matches.filter(m=>m.teamId!==t.id);if(DB.currentTeamId===t.id)DB.currentTeamId=DB.teams[0]?.id||null;save();render()}}
 else if(d.dm){if(confirm('Excluir esta partida? Isso não pode ser desfeito.')){DB.matches=DB.matches.filter(m=>m.id!==d.dm);save();render()}}});
render();
</script></body></html>
